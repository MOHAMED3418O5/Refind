<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي - Profile</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f2faf6;
            color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .profile-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 520px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 35px;
            text-align: center;
            border: 1px solid #e5e7eb;
        }

        .profile-header {
            margin-bottom: 25px;
        }

        .avatar-wrapper {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 15px auto;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #0f766e;
            background-color: #e6f4ea;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0f766e;
            font-size: 36px;
        }

        .profile-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 5px;
        }

        .profile-email {
            font-size: 0.9rem;
            color: #6b7280;
        }

        .info-form {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 25px;
            text-align: right;
            background-color: #fff;
        }

        .info-row {
            padding: 16px 20px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            font-size: 0.85rem;
            color: #6b7280;
            font-weight: 600;
            text-transform: uppercase;
        }

        .info-input {
            font-size: 1.05rem;
            color: #1f2937;
            font-weight: 500;
            border: 1px solid transparent;
            background: transparent;
            padding: 6px 0;
            width: 100%;
            outline: none;
            transition: border-color 0.2s;
        }

        .info-input:focus {
            border-bottom: 1px solid #0f766e;
        }

        .info-input.invalid {
            border-bottom: 1px solid #ef4444 !important;
        }

        .info-input.valid {
            border-bottom: 1px solid #0f766e !important;
        }

        .error-message {
            font-size: 0.75rem;
            color: #ef4444;
            display: none;
            margin-top: 2px;
        }

        .info-row.error .error-message {
            display: block;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: #0f766e;
            color: white;
        }

        .btn-primary:hover {
            background-color: #115e59;
        }

        .btn-logout {
            background-color: transparent;
            color: #0f766e;
            border: 1px solid #0f766e;
        }

        .btn-logout:hover {
            background-color: #f0fdf4;
        }

        /* .footer-bottom {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin: 20px 0;
        } */
    </style>
</head>

<body>

    <div class="profile-container">
        <div class="profile-header">
            <div class="avatar-wrapper">
                <div class="avatar" id="userAvatarIcon">👤</div>
            </div>
            <h1 class="profile-name" id="headerName">Fatma Salama</h1>
            <p class="profile-email" id="headerEmail">fatma@email.com</p>
        </div>


        <form id="profileForm" class="info-form" action="/update-profile" method="POST">
            <div class="info-row" id="rowText">
                <label class="info-label" for="text">Full Name</label>
                <input type="text" id="text" name="full_name" class="info-input" value="Fatma Salama">
                <span class="error-message" id="textError">not correct</span>
            </div>

            <div class="info-row" id="rowEmail">
                <label class="info-label" for="email">Email</label>
                <input type="email" id="email" name="email" class="info-input" value="fatma@email.com">
                <span class="error-message" id="emailError">not correct</span>
            </div>

            <div class="info-row" id="rowPhone">
                <label class="info-label" for="phone">Phone Number</label>
                <input type="text" id="phone" name="phone_number" class="info-input" value="01012345678">
                <span class="error-message" id="phoneError">not correct</span>
            </div>


            <div class="actions" style="padding: 0 20px 20px 20px;">
                <button type="submit" class="btn btn-primary" id="saveProfileBtn">Save Changes</button>
            </div>
        </form>

        <div class="actions" style="padding: 0 20px 20px 20px;">
            <button type="button" class="btn btn-logout" id="logoutBtn">Logout</button>
        </div>
    </div>
    <br>
    <br>
    <br>
    <br>
    <!-- <div class="footer-bottom">
        <p>Made with care to bring lost things back home. © 2026 Refind</p>
    </div> -->
    <script>
        function showError(elementId, msg) {
            const errorElement = document.getElementById(elementId);
            errorElement.textContent = msg;
            errorElement.parentElement.classList.add('error');
        }

        function clearError(elementId) {
            const errorElement = document.getElementById(elementId);
            errorElement.parentElement.classList.remove('error');
        }


        const cotext = /^[a-zA-Z]{3,15}$/;

        function ftext() {
            if (cotext.test(text.value.trim())) {
                text.classList.add('valid');
                text.classList.remove('invalid');
                clearError("textError");
                return true;
            } else {
                text.classList.add('invalid');
                text.classList.remove('valid');
                showError("textError", "not correct");
                return false;
            }
        }

        text.addEventListener('input', ftext);



        const cophone = /^(010|011|012|015)[0-9]{8}$/;

        function fphone() {
            if (cophone.test(phone.value.trim())) {
                phone.classList.add('valid');
                phone.classList.remove('invalid');
                clearError("phoneError");
                return true;
            } else {
                phone.classList.add('invalid');
                phone.classList.remove('valid');
                showError("phoneError", "not correct");
                return false;
            }
        }

        phone.addEventListener('input', fphone);



        const coemail = /^[a-zA-Z0-9]+@[a-zA-Z]+\.[a-zA-Z]+$/;
        function femail() {
            if (coemail.test(email.value.trim())) {
                email.classList.add('valid');
                email.classList.remove('invalid');
                clearError("emailError");
                return true;
            } else {
                email.classList.add('invalid');
                email.classList.remove('valid');
                showError("emailError", "not correct");
                return false;
            }
        }

        email.addEventListener('input', femail);



        document.getElementById('profileForm').addEventListener('submit', (e) => {
            const isTextValid = ftext();
            const isPhoneValid = fphone();
            const isEmailValid = femail();


            if (!isTextValid || !isPhoneValid || !isEmailValid) {
                e.preventDefault();
                alert("Please fix the errors in the form before saving.");
            } else {

            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            alert("Logged out successfully");
            window.location.href = '/login';
        });
    </script>
</body>

</html>
